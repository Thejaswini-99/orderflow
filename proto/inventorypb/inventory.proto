syntax = "proto3";
package inventory;

option go_package = "github.com/Thejaswini-99/orderflow/proto/inventorypb";

service InventoryService{
    rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);
}

message ReserveStockRequest{
    int64 order_id =1;
    int64 product_id=2;
    int64 quantity=3;
}

message ReserveStockResponse{
    bool reserved =1;
    string message=2;
}